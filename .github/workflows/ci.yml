name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: List schemes
        run: xcodebuild -list -project MoaPlus.xcodeproj

      - name: List available simulators
        run: xcrun simctl list devices available | grep -E 'iPhone' || true

      - name: Select simulator
        id: simulator
        run: |
          PREFERRED_DEVICES=(
            "iPhone 17 Pro"
            "iPhone 17"
            "iPhone 16 Pro"
            "iPhone 16"
          )

          SELECTED=""
          for device in "${PREFERRED_DEVICES[@]}"; do
            if xcrun simctl list devices available | grep -q "$device ("; then
              SELECTED="$device"
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            SELECTED=$(xcrun simctl list devices available \
              | grep -oE 'iPhone [0-9]+( Pro( Max)?)?( \()' \
              | sed 's/ ($//' \
              | sort -V \
              | tail -n 1)
          fi

          if [ -z "$SELECTED" ]; then
            echo "::error::사용 가능한 iPhone 시뮬레이터를 찾지 못했습니다."
            exit 1
          fi

          echo "선택된 디바이스: $SELECTED"
          echo "device=$SELECTED" >> $GITHUB_OUTPUT

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project MoaPlus.xcodeproj \
            -scheme MoaPlus \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}" \
            -derivedDataPath build \
            -quiet

      # 유닛 테스트를 UI 테스트보다 **먼저** 돌린다.
      # UI 테스트는 앱을 실행하고, 앱 실행은 App Group UserDefaults
      # (group.com.moaki.keyboard)에 기본값이 아닌 제스처 설정을 쓴다. 유닛
      # 테스트는 같은 저장소를 KeyboardSettings.shared 로 읽으므로, 순서가
      # 뒤집히면 KeyboardViewModelVowelDragTests 등 임계값에 민감한 테스트가
      # 코드와 무관하게 깨진다. 러너는 매 실행 새 컨테이너라 순서만 지키면 된다.
      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project MoaPlus.xcodeproj \
            -scheme MoaPlus \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}" \
            -derivedDataPath build \
            -only-testing:MoaPlusKeyboardTests \
            -resultBundlePath TestResults.xcresult

      - name: Run UI tests
        run: |
          xcodebuild test-without-building \
            -project MoaPlus.xcodeproj \
            -scheme MoaPlus \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}" \
            -derivedDataPath build \
            -only-testing:MoaPlusUITests \
            -resultBundlePath UITestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            UITestResults.xcresult
          retention-days: 7
